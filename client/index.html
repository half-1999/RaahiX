<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>RaahiX — Scheduled Intercity Shared Rides</title>
    <meta
      name="description"
      content="RaahiX. Shehar Se Shehar, Saath Safar. Scheduled intercity shared rides. A product by The Stack Guy."
    />
    <link rel="canonical" href="https://raahi-x.vercel.app/" />
    <meta name="theme-color" content="#f7f6f3" />
    <script>
      try {
        if (localStorage.getItem('raahix-theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch (error) {
        // Keep the light theme when storage is unavailable.
      }
    </script>
    <style>
      html[data-theme='dark'] { color-scheme: dark; }
      html[data-theme='dark'] body { background: #111214; color: #f7f7f5; }
    </style>
    <meta name="application-name" content="RaahiX" />

    <!-- Web app manifest: name, icons, start URL, and standalone display. -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Home-screen install on iOS. Android reads the same intent from the manifest. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="RaahiX" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RaahiX" />
    <meta property="og:url" content="https://raahi-x.vercel.app/" />
    <meta property="og:title" content="RaahiX — Scheduled Intercity Shared Rides" />
    <meta property="og:description" content="Shehar Se Shehar, Saath Safar. Find a scheduled intercity shared ride and book the seats you need." />
    <meta property="og:image" content="https://raahi-x.vercel.app/brand/raahix-lockup.png" />
  </head>
  <body style="margin:0">
    <div id="root">
      <div style="min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px">
        <div style="display:flex;flex-direction:column;align-items:center">
          <img src="/brand/raahix-lockup.png" alt="RaahiX" width="2172" height="724" style="width:min(320px,78vw);height:auto" />
          <div style="margin-top:24px;width:7rem;height:3px;background:#e6e4de;overflow:hidden">
            <div style="width:40%;height:100%;background:#e5ac32"></div>
          </div>
        </div>
      </div>
    </div>
    <script>
      if (document.documentElement.dataset.theme === 'dark') {
        var mark = document.querySelector('#root img');
        if (mark) {
          mark.src = '/brand/raahix-lockup-dark.png';
          mark.width = 2172;
          mark.height = 724;
        }
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
